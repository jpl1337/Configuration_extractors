name: native-check
on:
  push:
    branches: [ci/native-check]

env:
  IMAGE: cccs/assemblyline-service-configextractor:4.8.0.stable0
  MACO_PATCH_ZIP: https://github.com/jpl1337/Maco/archive/refs/heads/fix/bound-extractor-import-workers.zip
  PINS_REPO: https://github.com/jpl1337/Configuration_extractors.git
  PINS_BRANCH: fix/python-3.14-pins

jobs:
  service-load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pins: [stock, fixed]
        method: [tarfile, subprocess]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          printf 'FROM %s\nUSER root\nRUN apt-get update -qq && apt-get install -y -qq --no-install-recommends zstd && rm -rf /var/lib/apt/lists/*\nUSER assemblyline\n' "$IMAGE" > Dockerfile.cx
          docker build -q -t cxtest -f Dockerfile.cx .
      - name: Fetch the four default sources
        run: |
          S=/tmp/cxw/src; mkdir -p $S
          git clone -q --depth 1 https://github.com/cccs-rs/CAPE-parsers.git $S/CAPE_PARSERS
          if [ "${{ matrix.pins }}" = fixed ]; then
            git clone -q --depth 1 -b "$PINS_BRANCH" "$PINS_REPO" $S/RussianPanda95
          else
            git clone -q --depth 1 https://github.com/cccs-rs/Configuration_extractors.git $S/RussianPanda95
          fi
          git clone -q --depth 1 https://github.com/jeFF0Falltrades/rat_king_parser.git $S/RatKingParser
          git clone -q --depth 1 https://github.com/SEKOIA-IO/Community.git $S/SEKOIA
          chmod -R a+rwX /tmp/cxw
      - name: Build venvs like the updater (no memory cap)
        run: |
          docker run --rm -v /tmp/cxw:/tmp/cxw -v "$PWD/.ci":/h:ro --entrypoint python cxtest /h/cx_load.py install \
            /tmp/cxw/src/CAPE_PARSERS /tmp/cxw/src/RussianPanda95 /tmp/cxw/src/RatKingParser /tmp/cxw/src/SEKOIA 2>&1 | tail -5
      - name: Bundle sources like the 4.8 updater
        run: |
          docker run --rm -v /tmp/cxw:/tmp/cxw -v "$PWD/.ci":/h:ro --entrypoint python cxtest /h/make_bundles.py /tmp/cxw/src /tmp/cxw/bundles
      - name: Extract in the service process, then reload (1 CPU)
        run: |
          for mem in 1g 4g; do
            echo "======== method=${{ matrix.method }} pins=${{ matrix.pins }} cpus=1 mem=$mem"
            docker run --name cxload --cpus=1 --memory=$mem --memory-swap=$mem -v /tmp/cxw:/tmp/cxw -v "$PWD/.ci":/h:ro --entrypoint sh cxtest /h/measured_extract.sh ${{ matrix.method }} || true
            echo "CONTAINER $(docker inspect cxload --format 'OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}')"
            docker rm -f cxload >/dev/null
          done
